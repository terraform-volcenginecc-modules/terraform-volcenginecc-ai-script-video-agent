<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 ComfyUI 视频工作室</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: light-dark(#f5f5f5, #161616); }
    main { width: min(340px, calc(100vw - 64px)); padding: 32px; border: 1px solid light-dark(#ddd, #444); border-radius: 12px; background: light-dark(white, #222); }
    h1 { font-size: 22px; margin: 0 0 16px; } p { line-height: 1.6; }
    label, input, button { display: block; box-sizing: border-box; width: 100%; }
    input, button { margin-top: 12px; padding: 12px; font: inherit; border-radius: 6px; border: 1px solid #777; }
    button { cursor: pointer; } #提示 { min-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>ComfyUI 视频工作室</h1>
    <p>登录后使用官方工作流界面，调用方舟模型并归档至私有 TOS。</p>
    <form id="登录">
      <label for="密码">工作室登录密码</label>
      <input id="密码" type="password" autocomplete="current-password" required maxlength="1000">
      <button type="submit">登录</button>
      <p id="提示" role="status"></p>
    </form>
  </main>
  <script type="module" src="/login/login.js"></script>
</body>
</html>

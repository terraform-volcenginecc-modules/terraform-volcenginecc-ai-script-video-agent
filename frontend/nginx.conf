server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location ~ ^/api/projects/[^/]+/reference-images$ {
        client_max_body_size 41m;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /health {
        access_log off;
        return 200 "ok";
    }
}

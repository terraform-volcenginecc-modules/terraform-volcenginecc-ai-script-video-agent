map $http_x_forwarded_proto $app_scheme {
    default $scheme;
    https https;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 41m;
    # Keep response headers at server scope so login responses inherit the security headers.
    set $login_cache_control "";
    add_header Cache-Control $login_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${MEDIA_ORIGIN}; media-src 'self' blob: ${MEDIA_ORIGIN}; worker-src 'self' blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'" always;
    location = /login {
        set $login_cache_control "no-store";
        try_files /登录.html =404;
    }
    location = /登录.js {
        try_files /登录.js =404;
    }
    location /studio-api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $app_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://comfyui:8188;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $app_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 7200s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 401 = @login_redirect;
    }
    location @login_redirect {
        absolute_redirect off;
        set $login_cache_control "no-store";
        return 302 /login;
    }
    location = /health {
        access_log off;
        return 200 "ok";
    }
}
